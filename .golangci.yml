version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - revive
    - unparam
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G304 # reading the files the user names is the point of the tool
    revive:
      rules:
        - name: exported
          disabled: true # internal packages; the exported names are documented where it helps
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
