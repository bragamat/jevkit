name: install

# Runs the one-line installers, Homebrew and Scoop on every OS against a published release.
on:
  push:
    branches: [main]
    paths: [install.sh, install.ps1, .github/workflows/install.yml]
  pull_request:
    paths: [install.sh, install.ps1, .github/workflows/install.yml]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: release to install (default latest)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install with sh
        env:
          JEV_VERSION: ${{ inputs.version }}
        run: sh install.sh
      - name: run
        env:
          WANT: ${{ inputs.version }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          jev --version
          test -z "$WANT" || jev --version | grep -F "version ${WANT#v} "

  windows:
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: install
        env:
          JEV_VERSION: ${{ inputs.version }}
        run: ./install.ps1
      - name: run from a new shell
        env:
          WANT: ${{ inputs.version }}
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "User") + ";" + $env:Path
          $got = jev --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host $got
          if ($env:WANT -and -not ($got -like "*version $($env:WANT.TrimStart('v')) *")) { exit 1 }

  homebrew:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: brew install
        run: |
          test -x /home/linuxbrew/.linuxbrew/bin/brew && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install --cask bragamat/tap/jev
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: run
        env:
          WANT: ${{ inputs.version }}
        run: |
          jev --version
          test -z "$WANT" || jev --version | grep -F "version ${WANT#v} "

  scoop:
    runs-on: windows-latest
    steps:
      - name: scoop install
        shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"
          $shims = Join-Path $env:USERPROFILE "scoop\shims"
          $env:Path = "$shims;$env:Path"
          scoop bucket add bragamat https://github.com/bragamat/scoop-bucket
          scoop install bragamat/jev
          Add-Content $env:GITHUB_PATH $shims
      - name: run
        shell: pwsh
        env:
          WANT: ${{ inputs.version }}
        run: |
          $got = jev --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host $got
          if ($env:WANT -and -not ($got -like "*version $($env:WANT.TrimStart('v')) *")) { exit 1 }
