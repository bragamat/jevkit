version: 2

builds:
  - main: ./cmd/jev-cli
    binary: jev-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

# Signs and notarizes the macOS binaries with a Developer ID certificate, from the Linux runner.
# Off until the MACOS_SIGN_P12 secret exists, so releases keep working without it.
notarize:
  macos:
    - enabled: '{{ if index .Env "MACOS_SIGN_P12" }}true{{ else }}false{{ end }}'
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

homebrew_casks:
  - name: jev-cli
    binaries: [jev-cli]
    homepage: https://github.com/bragamat/jevkit
    description: Read less and decide with calibrated confidence through TypeSafe's Jev model
    license: MIT
    skip_upload: auto
    repository:
      owner: bragamat
      name: homebrew-tap
      git:
        url: git@github.com:bragamat/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    hooks:
      post:
        # The binary is not notarized; drop the quarantine flag so macOS runs it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/jev-cli"]
          end

scoops:
  - name: jev-cli
    homepage: https://github.com/bragamat/jevkit
    description: Read less and decide with calibrated confidence through TypeSafe's Jev model
    license: MIT
    skip_upload: auto
    repository:
      owner: bragamat
      name: scoop-bucket
      git:
        url: git@github.com:bragamat/scoop-bucket.git
        private_key: "{{ .Env.SCOOP_BUCKET_DEPLOY_KEY }}"

changelog:
  sort: asc
